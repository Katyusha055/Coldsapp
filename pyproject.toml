[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["venv", "mutants", "backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "FAST"]

[tool.ruff.lint.per-file-ignores]
"backend/**/tests/**" = ["S101", "S105", "S106"]
"backend/conftest.py" = ["S101", "S105", "S106", "S107"]
