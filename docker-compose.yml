services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
      - db
    volumes:
      - .:/app
    networks:
      - coldsapp_net

  db:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coldsapp_net
  
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - coldsapp_net
  evo_db:
    container_name: evo_postgres
    image: postgres:15
    command: ["postgres", "-c", "max_connections=1000"]
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - evo_postgres_data:/var/lib/postgresql/data
    networks:
      - coldsapp_net

  redis:
    image: redis:latest
    container_name: redis
    command: redis-server --port 6379 --appendonly yes
    restart: unless-stopped
    volumes:
      - evolution_redis:/data
    ports:
      - "6379:6379"
    networks:
      - coldsapp_net

  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env.evo
    depends_on:
      - evo_db
      - redis
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - coldsapp_net

volumes:
  postgres_data:
  evo_postgres_data:
  evolution_redis:
  evolution_instances:

networks:
  coldsapp_net:




  



 
